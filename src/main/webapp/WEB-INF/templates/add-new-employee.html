
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        form {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #d0d7de;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #2176ae;
        }

        @media (max-width: 480px) {
            form {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
<form method="post" th:action="@{/employee/save}">
    <!--      //data server tak le jaane ke liye -->
    <label for="name"> Name:</label>
    <input type="text" id="name" name="name" required>
    <br>
    <label for="branch">Branch:</label>
    <input type="text" id="branch" name="branch" required>
    <br>
    <label for="salary">Salary:</label>
    <input type="text" id="salary" name="salary" required>
    <br>
    <button type="submit">Submit</button>
    <a th:href="@{/employees}"></a>
</form>

</body>
</html>
