
<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(-45deg, #0f172a, #172554, #312e81, #164e63);
            background-size: 400% 400%;
            animation: gradientMove 14s ease infinite;
            min-height: 100vh;
            padding: 45px 30px;
            color: #f8fafc;
        }

        @keyframes gradientMove {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 30px;
            font-size: clamp(28px, 4vw, 40px);
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 25px rgba(96, 165, 250, 0.4);
            animation: fadeDown 0.7s ease both;
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body > a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            text-decoration: none;
            padding: 13px 22px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-weight: 700;
            font-size: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
            transition: transform 0.25s ease,
            box-shadow 0.25s ease,
            filter 0.25s ease;
        }

        body > a::before {
            content: "+";
            font-size: 21px;
            line-height: 15px;
        }

        body > a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(99, 102, 241, 0.5);
            filter: brightness(1.12);
        }

        table {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            border-collapse: separate;
            border-spacing: 0;
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            animation: fadeUp 0.8s ease both;
            animation-delay: 0.1s;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        thead {
            background: linear-gradient(120deg, #1e293b, #334155);
            color: #ffffff;
        }

        th {
            padding: 19px 20px;
            text-align: left;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
            border: none;
            white-space: nowrap;
        }

        td {
            padding: 17px 20px;
            color: #334155;
            font-size: 14px;
            border: none;
            border-bottom: 1px solid #e8edf4;
            transition: color 0.2s ease;
        }

        tbody tr {
            transition: background 0.25s ease;
        }

        tbody tr:hover {
            background: #eff6ff;
        }

        tbody tr:hover td {
            color: #1e40af;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* Delete button */
        button {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 3px 10px rgba(239, 68, 68, 0.15);
            transition: transform 0.2s ease,
            box-shadow 0.2s ease,
            filter 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
            filter: brightness(1.08);
        }

        button:active {
            transform: scale(0.96);
        }

        /* Update button */
        td a {
            display: inline-block;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            text-decoration: none;
            padding: 9px 15px;
            border-radius: 7px;
            margin-top: 7px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 3px 10px rgba(16, 185, 129, 0.15);
            transition: transform 0.2s ease,
            box-shadow 0.2s ease,
            filter 0.2s ease;
        }

        td a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
            filter: brightness(1.08);
        }

        td form {
            display: inline-block;
        }

        /* Keyboard accessibility */
        a:focus-visible,
        button:focus-visible {
            outline: 3px solid #fbbf24;
            outline-offset: 4px;
        }

        @media (max-width: 700px) {
            body {
                padding: 28px 12px;
            }

            h1 {
                margin-bottom: 24px;
            }

            table {
                min-width: 620px;
            }

            body {
                overflow-x: auto;
            }

            th, td {
                padding: 12px 10px;
            }

            body > a {
                padding: 11px 16px;
            }
        }

        /* Respect reduced-motion accessibility preferences */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
<h1>Employee List</h1>
<a th:href="@{/employee/add}">Add Employee</a>
<table border="1px">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Branch</th>
        <th>Salary</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="employee : ${employees}">
        <td th:text="${employee.id}"></td>
        <td th:text="${employee.name}"></td>
        <td th:text="${employee.branch}"></td>
        <td th:text="${employee.salary}"></td>

        <td>
            <form th:action="@{/employees/delete}" method="post">
                <input type="hidden" name="id" th:value="${employee.id}">
                <button type="submit">Delete</button>
            </form>
            <a th:href="@{/employee/update(id=${employee.id})}">Update</a>
            <!--                     Query string-->
        </td>
    </tr>

    <tr th:if="#{lists.isEmpty(employees(id=${employee.id}))}">
        <td colspan="4">
            <h1>No Employees Record found</h1>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
